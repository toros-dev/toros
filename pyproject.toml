[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toros"
version = "0.0.1"
description = "undeclared"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nikhil Sunder", email = "nsunder724@gmail.com" },
    { name = "Jake Schultz", email = "jakeschultz28@gmail.com" },
    { name = "John Bernardin", email = "john.bernardin@example.com" },
    { name = "Charlie Tucker", email = "charlietucker1919@gmail.com" },
]
keywords = [
    "finance", "data analysis", "data engineering", "machine learning", "tensor",
    "deep learning", "data representation", "financial data", "analytics", "data science", 
    "financial modeling", "edgar", "sec", "xbrl", 
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "torch",
]

[project.urls]
Repository = "https://github.com/edgar-sec-dev-team/toros"
Documentation = "https://edgar-sec-dev-team.github.io/toros"

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "bandit",
    "pytest",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toros"]

[tool.hatch.build.targets.sdist]
include = ["src/toros", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.mypy]
files = "src/toros"
ignore_missing_imports = true

[tool.pylint]
max-line-length = 200
disable = []
ignore-patterns = [".*\\.pyi$"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = "src"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]